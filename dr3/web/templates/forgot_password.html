{% extends "base.html" %}
{% block title %}Forgot password — Dirt Rally 3.0{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="panel">
    <img class="auth-logo" src="{{ url_for('static', filename='logo.png') }}" alt="DR3 logo" width="72" height="72">
    <h1>Forgot password</h1>
    <p class="meta">Enter the email you registered with and we'll send a reset link.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus>
      <button type="submit">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
