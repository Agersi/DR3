{% extends "base.html" %}
{% block title %}Register — Dirt Rally 3.0{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="panel">
    <img class="auth-logo" src="{{ url_for('static', filename='logo.png') }}" alt="DR3 logo" width="72" height="72">
    <h1>Create account</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username (3-32 chars, letters/numbers/_)</label>
      <input id="username" name="username" value="{{ username or '' }}" required autofocus>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required>
      <label for="display_name">Display name (optional)</label>
      <input id="display_name" name="display_name">
      <label for="country">Country (optional)</label>
      <select id="country" name="country">
        <option value="">—</option>
        {% for c in countries %}<option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
      <label for="password">Password (min 8 chars)</label>
      <input id="password" name="password" type="password" required>
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required>
      <button type="submit">Register</button>
    </form>
  </div>
</div>
{% endblock %}
