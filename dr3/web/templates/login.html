{% extends "base.html" %}
{% block title %}Log in — Dirt Rally 3.0{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="panel">
    <img class="auth-logo" src="{{ url_for('static', filename='logo.png') }}" alt="DR3 logo" width="72" height="72">
    <h1>Log in</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
  <p class="meta"><a href="{{ url_for('pages.forgot_password') }}">Forgot password?</a></p>
</div>
{% endblock %}
