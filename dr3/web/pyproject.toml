[project]
name = "dr3-web"
version = "0.1.0"
description = "Dirt Rally 3.0 community server web backend"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-wtf>=1.2.0",
    "flask-sqlalchemy>=3.1.0",
    "gunicorn>=23.0.0",
    "pymysql>=1.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
